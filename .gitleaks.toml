# Exceções pontuais ao gitleaks: só fixtures de teste, comparadas pela linha inteira.
# Nada de exclusões por pasta: um segredo real em test/ ainda seria encontrado.
[extend]
useDefault = true

[[allowlists]]
description = "Passkey FALSA (32 caracteres sintéticos) usada para testar a redação de logs"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^test/logger\.test\.js$''']
regexTarget = "line"
regexes = ['''(?m)^const PASSKEY = 'a1b2c3d4e5f60718293a4b5c6d7e8f90';$''']

[[allowlists]]
description = "Nome de arquivo de log com path traversal, usado para testar filePath()"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^test/logger\.test\.js$''']
regexTarget = "line"
regexes = ['''brazuka-2026-11-07\.log/\.\./\.\./etc/passwd''']

[[allowlists]]
description = "Valor sintético de segredo usado para provar que a rota do painel recusa e não o devolve"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^test/panel-settings\.test\.js$''']
regexTarget = "line"
regexes = ['''(?m)^    const sec = await tenta\(\{ PASSKEY: 'abc123segredo' \}\);$''']

[[allowlists]]
description = "Senha de administração SINTÉTICA de teste (histórico do PR da issue #24), linha exata"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^test/admin-painel\.test\.js$''']
regexTarget = "line"
regexes = [
  '''(?m)^    assert\.equal\(\(await t\.login\(\{ body: \{ password: 'outra-senha-bem-longa-77' \} \}\)\)\.status, 200\);$''',
  '''(?m)^    assert\.equal\(\(await t\.login\(\{ body: \{ password: 'outra-senha-bem-longa-77' \} \}\)\)\.status, 403, 'sem senha o Host da LAN fecha'\);$''',
]
