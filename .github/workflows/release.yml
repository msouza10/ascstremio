name: Release

# Versão e changelog saem dos títulos dos commits (Conventional Commits):
#   feat: -> versão menor   fix:/perf:/security: -> correção   feat!: ou BREAKING CHANGE: -> maior
# A cada push na main o release-please mantém aberto um PR "chore(main): release X.Y.Z" com o
# CHANGELOG.md e a versão nova. Mergear esse PR cria o release (rascunho), e os jobs abaixo
# montam os pacotes, publicam a imagem no GHCR e só então publicam o release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Changelog e versão
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    name: Versão e testes
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: A versão do package.json é a da tag
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "$version" = "${{ needs.release-please.outputs.version }}" ] || { echo "package.json=$version, release=${{ needs.release-please.outputs.version }}"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: scripts/check-no-secrets.sh .
      - run: node scripts/audit-check.js

  linux:
    name: Pacote Linux
    runs-on: ubuntu-latest
    needs: [release-please, verify]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # O curl baixa sempre do "último release" deste repositório.
      - run: scripts/build-release.sh --base-url "https://github.com/${{ github.repository }}/releases/latest/download"
      - run: scripts/check-no-secrets.sh dist/ascstremio-latest.tar.gz
      - run: scripts/smoke-install.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-linux
          path: dist/

  windows-build:
    name: Instalador Windows
    runs-on: ubuntu-latest
    needs: [release-please, verify]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis unzip
      - run: windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/AscStremio-Setup-*.exe*

  windows-smoke:
    name: Windows - instala e sobe
    runs-on: windows-latest
    needs: windows-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador-windows
      - shell: pwsh
        run: |
          $exe = Get-ChildItem AscStremio-Setup-*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\AscStremio'
          Start-Process wscript.exe -ArgumentList "`"$dir\launcher.vbs`""
          $ok = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7010/health -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw 'a ponte não respondeu no Windows' }
          & "$dir\stop.cmd"

  docker:
    name: Imagem no GHCR (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: [release-please, verify]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # X.Y.Z, X.Y e latest; os rótulos OCI ligam o pacote a este repositório.
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=match,pattern=(\d+\.\d+),group=1,value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest
      # Testa a imagem nativa antes de publicar a multi-arquitetura.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ascstremio:release-test
          cache-from: type=gha
      - run: scripts/smoke-container.sh ascstremio:release-test
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: [release-please, linux, windows-build, windows-smoke, docker]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: Resumo de SHA-256
        working-directory: artefatos
        run: |
          sha256sum -- install.sh ascstremio-*.tar.gz AscStremio-Setup-*.exe > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artefatos/ascstremio-*.tar.gz
            artefatos/AscStremio-Setup-*.exe
      # O release (rascunho) e as notas vêm do release-please; aqui entram os arquivos e ele é publicado.
      - name: Anexar arquivos e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            artefatos/install.sh artefatos/ascstremio-*.tar.gz artefatos/ascstremio-*.tar.gz.sha256 \
            artefatos/AscStremio-Setup-*.exe artefatos/AscStremio-Setup-*.exe.sha256 artefatos/SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
