name: Release

# Disparo: git tag vX.Y.Z && git push --tags  (X.Y.Z tem de ser a "version" do package.json).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Versão e testes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: v
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME não bate com package.json ($version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: scripts/check-no-secrets.sh .
      - run: node scripts/audit-check.js

  linux:
    name: Pacote Linux
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # O curl baixa sempre do "último release" deste repositório.
      - run: scripts/build-release.sh --base-url "https://github.com/${{ github.repository }}/releases/latest/download"
      - run: scripts/check-no-secrets.sh dist/ascstremio-latest.tar.gz
      - run: scripts/smoke-install.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-linux
          path: dist/

  windows-build:
    name: Instalador Windows
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis unzip
      - run: windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/AscStremio-Setup-*.exe*

  windows-smoke:
    name: Windows - instala e sobe
    runs-on: windows-latest
    needs: windows-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador-windows
      - shell: pwsh
        run: |
          $exe = Get-ChildItem AscStremio-Setup-*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\AscStremio'
          Start-Process wscript.exe -ArgumentList "`"$dir\launcher.vbs`""
          $ok = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7010/health -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw 'a ponte não respondeu no Windows' }
          & "$dir\stop.cmd"

  docker:
    name: Imagem (GHCR, amd64 + arm64)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # Constrói e testa a imagem nativa antes de publicar a multi-arquitetura.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ascstremio:release-test
          cache-from: type=gha
      - run: scripts/smoke-container.sh ascstremio:release-test
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: [verify, linux, windows-build, windows-smoke, docker]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: Resumo de SHA-256
        working-directory: artefatos
        run: |
          sha256sum -- install.sh ascstremio-*.tar.gz AscStremio-Setup-*.exe > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artefatos/ascstremio-*.tar.gz
            artefatos/AscStremio-Setup-*.exe
      - name: Criar o release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --generate-notes \
            artefatos/install.sh artefatos/ascstremio-*.tar.gz artefatos/ascstremio-*.tar.gz.sha256 \
            artefatos/AscStremio-Setup-*.exe artefatos/AscStremio-Setup-*.exe.sha256 artefatos/SHA256SUMS
