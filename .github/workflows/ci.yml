name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Binários nativos (node-datachannel) vêm do GitHub Releases: cache + nova tentativa
      # evitam que uma falha passageira de lá (504) derrube a esteira.
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_prebuilds
          key: prebuilds-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: npm ci (com novas tentativas)
        shell: bash
        run: |
          for i in 1 2 3 4; do npm ci --no-audit --no-fund && exit 0; echo "tentativa $i falhou; aguardando"; sleep $((i * 20)); done; exit 1
      - run: npm run check

  commits:
    name: Commits no padrão (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # O título do commit decide a versão e o changelog: ver scripts/check-commits.sh.
      - run: scripts/check-commits.sh "origin/${{ github.base_ref }}..HEAD"

  lint:
    name: Shell, workflows e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a auditoria de segredos percorre todo o histórico
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh windows/build.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Nenhum dado de conta no repositório
        run: scripts/check-no-secrets.sh .
      - name: Nenhum segredo no histórico (gitleaks, local)
        run: scripts/audit-secrets.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Auditoria de dependências (produção, com exceções justificadas)
        run: node scripts/audit-check.js

  package-linux:
    name: Pacote e instalação por curl (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-release.sh --base-url "https://example.invalid"
      - run: scripts/check-no-secrets.sh dist/ascstremio-latest.tar.gz
      - name: Instalação como usuário novo (sem Node no PATH)
        run: |
          # Esconde o Node do runner para exercitar o download com SHA-256.
          mkdir -p "$RUNNER_TEMP/bin"
          for f in /usr/bin/*; do case "${f##*/}" in node|npm|npx|corepack) ;; *) ln -sf "$f" "$RUNNER_TEMP/bin/";; esac; done
          PATH="$RUNNER_TEMP/bin" scripts/smoke-install.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-linux
          path: dist/
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ascstremio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke-container.sh ascstremio:ci
      - name: docker compose valida
        run: docker compose config -q

  windows-installer:
    name: Instalador Windows (compila e instala de verdade)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis unzip
      - run: windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/AscStremio-Setup-*.exe*
          retention-days: 7

  windows-smoke:
    name: Windows - instala em silêncio e sobe
    runs-on: windows-latest
    needs: windows-installer
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador-windows
      - name: Instala (/S) e confere o SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem AscStremio-Setup-*.exe | Select-Object -First 1
          $want = (Get-Content "$($exe.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower() -ne $want.ToLower()) { throw 'SHA-256 do instalador não confere' }
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\AscStremio'
          foreach ($f in 'node\node.exe','app\src\index.js','start.cmd','stop.cmd','desinstalar.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "faltou $f na instalação" }
          }
      - name: Sobe o serviço e consulta a ponte
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\AscStremio'
          Start-Process wscript.exe -ArgumentList "`"$dir\launcher.vbs`""
          $ok = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7010/health -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\AscStremio\data\service.log" -ErrorAction SilentlyContinue | Select-Object -Last 40; throw 'a ponte não respondeu' }
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7020/).StatusCode
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7000/manifest.json).StatusCode
      - name: Para e desinstala
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\AscStremio'
          & "$dir\stop.cmd"
          Start-Process "$dir\desinstalar.exe" -ArgumentList '/S' -Wait
          Start-Sleep 3
          if (Test-Path "$dir\node") { throw 'desinstalação não removeu o programa' }
          if (-not (Test-Path "$env:LOCALAPPDATA\AscStremio\data")) { throw 'a pasta de dados deveria ter sido mantida' }
