name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Binários nativos (node-datachannel) vêm do GitHub Releases: cache + nova tentativa
      # evitam que uma falha passageira de lá (504) derrube a esteira.
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_prebuilds
          key: prebuilds-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: npm ci (com novas tentativas)
        shell: bash
        run: |
          for i in 1 2 3 4; do npm ci --no-audit --no-fund && exit 0; echo "tentativa $i falhou; aguardando"; sleep $((i * 20)); done; exit 1
      - run: npm run check

  commits:
    name: Commits no padrão (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # O título do commit decide a versão e o changelog: ver scripts/check-commits.sh.
      - run: scripts/check-commits.sh "origin/${{ github.base_ref }}..HEAD"

  lint:
    name: Shell, workflows e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a auditoria de segredos percorre todo o histórico
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh windows/build.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Nenhum dado de conta no repositório
        run: scripts/check-no-secrets.sh .
      - name: Nenhum segredo no histórico (gitleaks, local)
        run: scripts/audit-secrets.sh --head
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Auditoria de dependências (produção, com exceções justificadas)
        run: node scripts/audit-check.js

  package-linux:
    name: Pacote e instalação por curl (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: scripts/build-release.sh --base-url "https://example.invalid"
      - run: scripts/check-no-secrets.sh dist/ascstremio-latest.tar.gz
      - name: Instalação como usuário novo (sem Node no PATH)
        run: |
          # Esconde o Node do runner para exercitar o download com SHA-256.
          mkdir -p "$RUNNER_TEMP/bin"
          for f in /usr/bin/*; do case "${f##*/}" in node|npm|npx|corepack) ;; *) ln -sf "$f" "$RUNNER_TEMP/bin/";; esac; done
          PATH="$RUNNER_TEMP/bin" scripts/smoke-install.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-linux
          path: dist/
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ascstremio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke-container.sh ascstremio:ci
      - name: Nenhum segredo na imagem (gitleaks sobre o sistema de arquivos)
        run: scripts/audit-secrets.sh --image ascstremio:ci
      - name: docker compose valida
        run: docker compose config -q

  windows-installer:
    name: Instalador Windows (compila e instala de verdade)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis unzip
      - run: windows/build.sh
      - name: Nenhum segredo no instalador (gitleaks sobre o .exe extraído)
        run: |
          command -v 7z >/dev/null || sudo apt-get install -y --no-install-recommends 7zip
          7z x -y -o"$RUNNER_TEMP/exe" dist/AscStremio-Setup-*.exe >/dev/null
          scripts/audit-secrets.sh --dir "$RUNNER_TEMP/exe"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/AscStremio-Setup-*.exe*
          retention-days: 7

  windows-smoke:
    name: Windows - instala em silêncio e sobe
    runs-on: windows-latest
    needs: windows-installer
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: instalador-windows
      - name: Instala (/S) e confere o SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem AscStremio-Setup-*.exe | Select-Object -First 1
          $want = (Get-Content "$($exe.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower() -ne $want.ToLower()) { throw 'SHA-256 do instalador não confere' }
          # Dados do modelo antigo (por usuário): têm de ser movidos, não copiados nem perdidos.
          $antigo = Join-Path $env:LOCALAPPDATA 'AscStremio\data'
          New-Item -ItemType Directory -Force $antigo | Out-Null
          Set-Content -Path (Join-Path $antigo 'marcador-migracao.txt') -Value 'dados antigos'
          # Sem -Wait: ele esperaria também a bandeja, que o instalador abre e nunca termina.
          $inst = Start-Process $exe.FullName -ArgumentList '/S' -PassThru
          if (-not $inst.WaitForExit(300000)) { $inst.Kill(); throw 'o instalador excedeu 5 minutos' }
          if ($inst.ExitCode -ne 0) { throw "instalador saiu com código $($inst.ExitCode)" }
          $dir = Join-Path $env:ProgramFiles 'AscStremio'
          foreach ($f in 'node\node.exe','app\src\index.js','app\LEGAL.md','LEGAL.md','start.cmd','stop.cmd','AscStremioServico.exe','AscStremioServico.xml','bandeja.ps1','bandeja.vbs','parar-bandeja.cmd','desinstalar.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "faltou $f na instalação" }
          }
          $dados = Join-Path $env:ProgramData 'AscStremio\data'
          if (-not (Test-Path (Join-Path $dados 'marcador-migracao.txt'))) {
            Write-Host "antigo existe: $(Test-Path $antigo) ($antigo)"
            Get-ChildItem -Force -Recurse -Depth 2 (Join-Path $env:ProgramData 'AscStremio') -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "ProgramData: $($_.FullName)" }
            Get-ChildItem -Force -Recurse -Depth 2 (Split-Path $antigo) -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Local: $($_.FullName)" }
            icacls (Join-Path $env:ProgramData 'AscStremio') | Write-Host
            throw 'os dados antigos não foram movidos para o ProgramData'
          }
          if (Test-Path $antigo) { throw 'a pasta de dados antiga deveria ter sido movida (não copiada)' }
      - name: O serviço do Windows está instalado, automático e com a conta de baixo privilégio
        shell: pwsh
        run: |
          $svc = Get-CimInstance Win32_Service -Filter "Name='AscStremio'"
          if (-not $svc) { throw 'o serviço AscStremio não foi criado' }
          if ($svc.StartMode -ne 'Auto') { throw "início deveria ser automático, é $($svc.StartMode)" }
          if ($svc.StartName -notmatch 'LocalService') { throw "conta inesperada: $($svc.StartName)" }
          $acl = (icacls (Join-Path $env:ProgramData 'AscStremio') | Out-String)
          if ($acl -match 'Users|Everyone|Todos') { throw "a pasta de dados está aberta a outros usuários:`n$acl" }
      - name: A bandeja tem sintaxe válida
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'AscStremio'
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $dir 'bandeja.ps1'), [ref]$null, [ref]$erros) | Out-Null
          if ($erros -and $erros.Count) { $erros | ForEach-Object { Write-Host $_.Message }; throw 'bandeja.ps1 com erro de sintaxe' }
      - name: Sobe o serviço e consulta a ponte
        timeout-minutes: 4
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'AscStremio'
          $logServico = Join-Path $env:ProgramData 'AscStremio\data\AscStremioServico.out.log'
          function Esperar-Ponte([int]$segundos = 90) {
            foreach ($i in 1..$segundos) {
              try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7010/health -TimeoutSec 2).StatusCode -eq 200) { return $true } } catch { Start-Sleep 1 }
            }
            return $false
          }
          # O serviço sobe sozinho (início automático); ninguém chama launcher nem start.cmd.
          if ((Get-Service AscStremio).Status -ne 'Running') { Start-Sleep 5 }
          if ((Get-Service AscStremio).Status -ne 'Running') { throw 'o serviço não está Running depois da instalação' }
          if (-not (Esperar-Ponte)) { Get-Content $logServico -ErrorAction SilentlyContinue | Select-Object -Last 40; throw 'a ponte não respondeu' }
          # A bandeja (aberta pelo instalador) fica de pé: um único processo, com o script dela.
          Start-Sleep 8
          $bandejas = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like '*bandeja.ps1*' })
          if ($bandejas.Count -lt 1) { throw 'a bandeja não está rodando' }
          if ($bandejas.Count -gt 1) { throw "mais de uma bandeja rodando ($($bandejas.Count))" }
          # Reiniciar pelo serviço (o que o menu da bandeja faz) devolve a ponte.
          Restart-Service AscStremio -Force
          if (-not (Esperar-Ponte)) { Get-Content $logServico -ErrorAction SilentlyContinue | Select-Object -Last 40; throw 'a ponte não voltou depois de reiniciar' }
          # Se o processo cair, o serviço levanta de novo sozinho.
          $pidAntes = (Get-CimInstance Win32_Service -Filter "Name='AscStremio'").ProcessId
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.ExecutablePath -like "$dir\node\*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep 3
          if (-not (Esperar-Ponte 120)) { Get-Content $logServico -ErrorAction SilentlyContinue | Select-Object -Last 40; throw 'o serviço não se recuperou da queda do processo' }
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7020/ -TimeoutSec 10).StatusCode
          $aviso = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7020/avisos-legais -TimeoutSec 10
          $esperado = [System.IO.File]::ReadAllText((Join-Path $dir 'app\LEGAL.md'))
          if ($aviso.Content -cne $esperado) { throw 'aviso legal servido difere do arquivo instalado' }
          # O addon exige credencial: sem ela 403; com a emitida pelo CLI, 200.
          $env:DATA_DIR = Join-Path $env:ProgramData 'AscStremio\data'
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7000/manifest.json -TimeoutSec 10 | Out-Null; throw 'o addon respondeu sem credencial' } catch { if ($_.Exception.Message -eq 'o addon respondeu sem credencial') { throw }; if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw 'esperava 403 sem credencial' } }
          # Primeira credencial pelo mesmo caminho do atalho do Menu Iniciar (sem pausa). A saída
          # não é impressa: o token não pode ir para o log da esteira.
          $env:ASC_SEM_PAUSA = '1'
          # Captura somente em memória, com prazo por execução. Nunca grava a credencial
          # em arquivo/outputs nem imprime o stdout do atalho na esteira.
          function Invoke-Credenciais {
            $p = [System.Diagnostics.Process]::new()
            $p.StartInfo.FileName = $env:ComSpec
            $p.StartInfo.Arguments = '/d /s /c ""' + (Join-Path $dir 'credenciais.cmd') + '""'
            $p.StartInfo.UseShellExecute = $false
            $p.StartInfo.RedirectStandardOutput = $true
            $p.StartInfo.RedirectStandardError = $true
            $p.StartInfo.RedirectStandardInput = $true
            try {
              $p.Start() | Out-Null
              $p.StandardInput.Close()
              $stdout = $p.StandardOutput.ReadToEndAsync()
              $stderr = $p.StandardError.ReadToEndAsync()
              if (-not $p.WaitForExit(60000)) { $p.Kill($true); throw 'credenciais.cmd excedeu 60 segundos' }
              $output = $stdout.GetAwaiter().GetResult()
              $null = $stderr.GetAwaiter().GetResult()
              if ($p.ExitCode -ne 0) { throw "credenciais.cmd falhou (código $($p.ExitCode)); saída omitida para proteger tokens" }
              return $output
            } finally { $p.Dispose() }
          }
          Write-Host 'Ponte e painel responderam; emitindo a primeira credencial pelo atalho.'
          $url = ((Invoke-Credenciais) -split "`r?`n" | Select-String 'manifest\.json$').Line
          if (-not $url) { throw 'a credencial não foi emitida' }
          # Idempotente: com credencial ativa, uma segunda execução não emite outra.
          Write-Host 'Primeira credencial emitida; verificando idempotência.'
          $again = Invoke-Credenciais
          if ($again -match 'manifest\.json' -or $again -notmatch 'existe credencial ativa') { throw 'credenciais.cmd emitiu de novo' }
          # O token não pode estar no log do serviço.
          $tok = ($url -split '/')[3]
          if ((Get-Content $logServico -Raw -ErrorAction SilentlyContinue) -match [regex]::Escape($tok)) { throw 'token apareceu no log do serviço' }
          $code = (Invoke-WebRequest -UseBasicParsing $url -TimeoutSec 10).StatusCode
          if ($code -ne 200) { throw "addon com credencial -> $code" }
          # --- Robustez do serviço ---
          # 1) As portas HTTP só escutam em 127.0.0.1 (invariante de segurança; o modo LAN não está ligado).
          $escutas = @(Get-NetTCPConnection -State Listen -LocalPort 7000,7010,7020 -ErrorAction Stop)
          if ($escutas.Count -lt 3) { throw "esperava as portas 7000, 7010 e 7020 escutando; achei $($escutas.Count)" }
          $fora = @($escutas | Where-Object { $_.LocalAddress -ne '127.0.0.1' })
          if ($fora.Count) { throw "porta HTTP fora do loopback: $(($fora | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort)" }) -join ', ')" }
          # 2) A recuperação automática está configurada no gerenciador de serviços (não só no XML).
          $falha = (sc.exe qfailure AscStremio | Out-String)
          if ($falha -notmatch 'RESTART') { throw "o serviço não tem reinício em caso de falha:`n$falha" }
          # 3) O estado que a bandeja mostra, pelo mesmo código e no PowerShell 5.1 que ela usa.
          function Estado-Bandeja { (powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'bandeja.ps1') -SomenteEstado | Select-Object -First 1) }
          if ((Estado-Bandeja) -ne 'online') { throw "bandeja deveria ver online, viu '$(Estado-Bandeja)'" }
          # 4) Parada limpa: o serviço pára, não sobra processo nem porta, e a bandeja vê 'parado'.
          Stop-Service AscStremio -Force
          if ((Get-Service AscStremio).Status -ne 'Stopped') { throw 'o serviço não parou' }
          if ((Estado-Bandeja) -ne 'parado') { throw "bandeja deveria ver parado, viu '$(Estado-Bandeja)'" }
          $sobrou = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.ExecutablePath -like "$dir\node\*" })
          if ($sobrou.Count) { throw 'sobrou node.exe do serviço depois de parar' }
          if (Get-NetTCPConnection -State Listen -LocalPort 7000,7010,7020 -ErrorAction SilentlyContinue) { throw 'porta do serviço ainda aberta depois de parar' }
          Start-Service AscStremio
          if (-not (Esperar-Ponte)) { Get-Content $logServico -ErrorAction SilentlyContinue | Select-Object -Last 40; throw 'a ponte não voltou depois de parar e iniciar' }
          if ((Estado-Bandeja) -ne 'online') { throw "bandeja deveria ver online de novo, viu '$(Estado-Bandeja)'" }
          # 5) A credencial emitida sobrevive ao reinício.
          if ((Invoke-WebRequest -UseBasicParsing $url -TimeoutSec 10).StatusCode -ne 200) { throw 'a credencial não sobreviveu ao reinício' }
          # 6) Atualizar por cima (mesmo instalador, serviço rodando): credencial e dados ficam, a bandeja é uma só.
          $setup = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'AscStremio-Setup-*.exe') | Select-Object -First 1
          $inst2 = Start-Process $setup.FullName -ArgumentList '/S' -PassThru
          if (-not $inst2.WaitForExit(300000)) { $inst2.Kill(); throw 'a atualização por cima excedeu 5 minutos' }
          if ($inst2.ExitCode -ne 0) { throw "atualização por cima saiu com código $($inst2.ExitCode)" }
          if ((Get-Service AscStremio).Status -ne 'Running') { Start-Sleep 5 }
          if ((Get-Service AscStremio).Status -ne 'Running') { throw 'o serviço não está Running depois de atualizar por cima' }
          if (-not (Esperar-Ponte)) { Get-Content $logServico -ErrorAction SilentlyContinue | Select-Object -Last 40; throw 'a ponte não voltou depois de atualizar por cima' }
          if ((Invoke-WebRequest -UseBasicParsing $url -TimeoutSec 10).StatusCode -ne 200) { throw 'a credencial se perdeu ao atualizar por cima' }
          if (-not (Test-Path (Join-Path $env:ProgramData 'AscStremio\data\marcador-migracao.txt'))) { throw 'os dados se perderam ao atualizar por cima' }
          Start-Sleep 8
          $bandejas2 = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like '*bandeja.ps1*' })
          if ($bandejas2.Count -ne 1) { throw "depois de atualizar deveria haver 1 bandeja, há $($bandejas2.Count)" }
      - name: Usuário comum controla só o serviço e não lê os dados
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Conta local sem privilégio, criada só para este teste e removida no fim.
          $senha = 'Tst-' + [guid]::NewGuid().ToString('N') + 'aA1!'
          $seg = ConvertTo-SecureString $senha -AsPlainText -Force
          $pasta = 'C:\ascteste'
          New-Item -ItemType Directory -Force $pasta | Out-Null
          try {
            New-LocalUser -Name ascteste -Password $seg -PasswordNeverExpires -AccountNeverExpires | Out-Null
            Add-LocalGroupMember -Group Users -Member ascteste
            icacls $pasta /grant 'ascteste:(OI)(CI)M' | Out-Null
            Set-Content -Path (Join-Path $pasta 'teste.ps1') -Value @'
          $r = New-Object System.Collections.Generic.List[string]
          sc.exe stop AscStremio | Out-Null;  $r.Add("parar=$LASTEXITCODE")
          foreach ($i in 1..30) { if ((Get-Service AscStremio).Status -eq 'Stopped') { break }; Start-Sleep 1 }
          $r.Add("parado=$((Get-Service AscStremio).Status)")
          sc.exe start AscStremio | Out-Null; $r.Add("iniciar=$LASTEXITCODE")
          # Não pode mexer na configuração do serviço nem ler os dados da conta.
          sc.exe config AscStremio start= disabled | Out-Null; $r.Add("config=$LASTEXITCODE")
          try { Get-Content (Join-Path $env:ProgramData 'AscStremio\data\admin-key') -ErrorAction Stop | Out-Null; $r.Add('ler_admin_key=PERMITIDO') } catch { $r.Add('ler_admin_key=NEGADO') }
          try { Get-ChildItem (Join-Path $env:ProgramData 'AscStremio\data') -ErrorAction Stop | Out-Null; $r.Add('listar_dados=PERMITIDO') } catch { $r.Add('listar_dados=NEGADO') }
          Set-Content -Path 'C:\ascteste\saida.txt' -Value $r
          '@
            $cred = [pscredential]::new("$env:COMPUTERNAME\ascteste", $seg)
            Start-Process powershell.exe -Credential $cred -LoadUserProfile -WorkingDirectory $pasta -Wait -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',(Join-Path $pasta 'teste.ps1')
            if (-not (Test-Path (Join-Path $pasta 'saida.txt'))) { throw 'o usuário comum não conseguiu rodar o teste' }
            $saida = Get-Content (Join-Path $pasta 'saida.txt')
            $saida | ForEach-Object { Write-Host $_ }
            foreach ($esperado in 'parar=0','parado=Stopped','iniciar=0','config=5','ler_admin_key=NEGADO','listar_dados=NEGADO') {
              if ($saida -notcontains $esperado) { throw "esperava '$esperado' para o usuário comum" }
            }
          } finally {
            Remove-LocalUser -Name ascteste -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $pasta -ErrorAction SilentlyContinue
          }
          # O serviço volta ao ar (ele foi parado e iniciado por esse usuário).
          $ok = $false
          foreach ($i in 1..90) { try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7010/health -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 1 } }
          if (-not $ok) { throw 'a ponte não voltou depois do teste do usuário comum' }
      - name: Para e desinstala
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'AscStremio'
          & "$dir\stop.cmd"
          Start-Process "$dir\desinstalar.exe" -ArgumentList '/S' -Wait
          # O desinstalador se copia para a pasta temporária e o -Wait volta antes do fim: espera.
          foreach ($i in 1..60) { if (-not (Test-Path "$dir\node") -and -not (Get-Service AscStremio -ErrorAction SilentlyContinue)) { break }; Start-Sleep 1 }
          if (Get-Service AscStremio -ErrorAction SilentlyContinue) { throw 'o serviço não foi removido' }
          if (Test-Path "$dir\node") { throw 'desinstalação não removeu o programa' }
          if (-not (Test-Path (Join-Path $env:ProgramData 'AscStremio\data'))) { throw 'a pasta de dados deveria ter sido mantida' }
